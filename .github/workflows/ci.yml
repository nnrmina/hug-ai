name: CI

# The production server deploys a commit on main only after this workflow succeeds
# (see deploy/autodeploy.sh). Keep the job name stable: the server looks for it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend tests
        working-directory: backend
        env:
          LLM_PROVIDER: rule_based
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend syntax check
        run: |
          find public -name '*.js' -print0 | xargs -0 -n1 node --check
          node --input-type=module -e "await import('./public/static/js/contacts.js').catch(e => { console.error(e); process.exit(1) })"

      - name: Docker image builds
        run: docker build -q -f backend/Dockerfile -t hug-ai-ci .
