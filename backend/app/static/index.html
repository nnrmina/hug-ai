<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#E9F2E6" />
  <title>HUG</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="phone-shell">
    <!-- Minimal Status Bar -->
    <div class="status-bar">
      <span id="status-clock" class="clock">09:41</span>
      <div class="status-icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <rect x="0" y="8" width="2.5" height="4" rx="1"/>
          <rect x="4" y="6" width="2.5" height="6" rx="1"/>
          <rect x="8" y="3" width="2.5" height="9" rx="1"/>
          <rect x="12" y="0" width="2.5" height="12" rx="1"/>
        </svg>
        <svg width="15" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-3.6-2a5.2 5.2 0 017.2 0l1.2-1.2a7 7 0 00-9.6 0l1.2 1.2zm-2.8-2.8a9.2 9.2 0 0112.8 0l1.2-1.2a11 11 0 00-15.2 0l1.2 1.2z"/>
        </svg>
        <div class="battery-icon"><div class="battery-level"></div></div>
      </div>
    </div>

    <!-- Top Navigation Row -->
    <header class="top-nav">
      <button id="btn-open-contacts" class="circle-icon-btn" title="Kontaktlar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="7" x2="16" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="12" y2="17"/>
        </svg>
      </button>

      <div id="agent-pill" class="center-pill">
        <span class="sparkle">✦</span>
        <span id="agent-pill-text">HUG</span>
      </div>

      <button id="btn-new-contact" class="circle-icon-btn" title="Yeni Kontakt Əlavə Et">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
    </header>

    <!-- Main Content (Voice-Only: Headline + 3D Green AI Orb) -->
    <main class="screen-main">
      <div class="headline-block">
        <h1 id="hero-title">
          Bu gün sizə necə <span class="accent-word">kömək</span><br />edə bilərəm?
        </h1>
        <p id="live-status-text" class="live-status-text"></p>
      </div>

      <!-- 3D Glossy Green AI Orb + Mirror Reflection (Interactive Voice Button) -->
      <div class="orb-stage">
        <button id="ai-orb-btn" class="ai-orb" aria-label="Danışmaq üçün toxunun">
          <span class="orb-highlight-top"></span>
          <span class="orb-highlight-inner"></span>
          <span class="orb-crescent"></span>
        </button>
        <div id="orb-reflection" class="orb-reflection"></div>
      </div>

      <div class="bottom-spacer"></div>
    </main>

    <!-- Clean Minimal Calling Overlay (When AI Agent calls the contact) -->
    <section id="call-overlay" class="call-overlay hidden">
      <div class="call-card">
        <span class="call-badge">✦ HUG Zəng Edir</span>
        <div class="call-orb-avatar" id="call-avatar">A</div>
        <h2 id="call-name">Almaz Məmmədova</h2>
        <p id="call-number" class="call-number">+994 50 456 78 90</p>
        <p id="call-state-text" class="call-state-text">Nömrə yığılır...</p>

        <div class="call-actions">
          <a id="native-tel-link" href="tel:+994504567890" class="dialer-btn">
            📞 Nömrə Yığıcı
          </a>
          <button id="btn-end-call" class="end-call-btn">
            Zəngi Bitir
          </button>
        </div>
      </div>
    </section>

    <!-- Minimal Contacts Drawer -->
    <section id="contacts-drawer" class="contacts-drawer hidden">
      <div class="drawer-header">
        <h3>Kontaktlar</h3>
        <button id="btn-close-drawer" class="circle-icon-btn">✕</button>
      </div>

      <form id="add-contact-form" class="drawer-form">
        <input type="text" id="new-name" placeholder="Ad (məs: Almaz)" required />
        <input type="tel" id="new-phone" placeholder="+994 50 456 78 90" required />
        <button type="submit" class="send-pill-btn">Əlavə et</button>
      </form>

      <div id="contacts-list" class="contacts-list"></div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
