name: yaxin_ai_mobile
description: YAXIN AI - AI-Powered Voice Assistant & Digital Life Agent (Azerbaijan MVP)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_riverpod: ^2.5.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  flutter_contacts: ^1.1.9
  url_launcher: ^6.3.0
  flutter_local_notifications: ^19.0.0
  permission_handler: ^12.0.0
  intl: ^0.20.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

